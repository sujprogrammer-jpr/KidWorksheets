<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6C63FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KidWorksheets">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- SEO -->
  <title>KidWorksheets — UKG-C Term 1 Exam Preparation</title>
  <meta name="description" content="Interactive exam preparation worksheets for UKG-C Term 1. Practice English, Maths, Hindi, General Awareness and Art. Installable offline PWA.">
  <meta name="keywords" content="UKG worksheets, kindergarten exam, KidWorksheets, interactive learning, hindi worksheets, english worksheets">
  <meta property="og:title" content="KidWorksheets — UKG-C Term 1">
  <meta property="og:description" content="Interactive worksheets for UKG-C. 300+ questions across 5 subjects. Works offline!">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/app.css">

  <style>
    /* Inline critical styles to prevent FOUC */
    body { margin: 0; background: #0F0F1A; }
    #app { min-height: 100vh; }
    .loading-init {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      background: #0F0F1A; color: #F0F0FF;
      font-family: 'Nunito', sans-serif;
      gap: 16px;
    }
    .loading-init .spin {
      font-size: 56px;
      animation: spin-logo 2s ease-in-out infinite;
    }
    @keyframes spin-logo {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.1) rotate(-8deg); }
    }
  </style>
</head>
<body>
  <!-- App Root — content rendered by app.js -->
  <div id="app">
    <div class="loading-init">
      <div class="spin">✏️</div>
      <div style="font-size:20px;font-weight:700">KidWorksheets</div>
      <div style="font-size:14px;color:#9090B0">Loading your worksheets…</div>
    </div>
  </div>

  <!-- Data (loaded first so app.js can use SUBJECTS, ALL_WORKSHEETS etc.) -->
  <script src="js/data.js"></script>

  <!-- Application -->
  <script src="js/app.js"></script>
</body>
</html>
